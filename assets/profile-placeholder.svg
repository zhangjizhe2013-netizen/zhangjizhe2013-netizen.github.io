  </defs>
  <circle cx="210" cy="210" r="169" fill="#f8fcfd" stroke="#b8d1dc" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="210" cy="210" r="145" fill="none" stroke="#dcebf1" stroke-width="1" stroke-dasharray="4 8"/>
