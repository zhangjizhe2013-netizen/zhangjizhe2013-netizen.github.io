<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="title desc">
  <title id="title">Ji-Zhe Zhang monogram</title>
  <desc id="desc">A typographic JZ monogram used until a portrait is supplied.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#173f5b"/>
      <stop offset="1" stop-color="#2d6f92"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#173f5b" flood-opacity=".18"/>
